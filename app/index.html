<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cardfile</title>
  <meta name="description" content="Scan business cards and keep them organized by tag.">
  <meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15191c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cardfile">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <!-- Camera / library pickers. "capture" opens the camera directly on iPhone. -->
  <input id="pick-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="pick-library" type="file" accept="image/*" hidden>
  <input id="pick-backup" type="file" accept="application/json,.json" hidden>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
